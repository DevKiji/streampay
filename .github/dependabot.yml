version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "cargo"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "npm"
    ignore:
      # TypeScript 7 is the native (Go) compiler and no longer ships the classic
      # JS API that typescript-eslint (peer: <6.1.0) and Next's build-time type
      # check load. Remove this once typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
